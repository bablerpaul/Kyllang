version: '3.8'

services:
  proxy-node-1:
    build:
      context: ./proxy-service
    ports:
      - "5001:5000"
    environment:
      - NODE_ID=1
      - PORT=5000
      # Requires RPC_URL environment variable to be set on host
      - RPC_URL=${RPC_URL}
      - EMERGENCY_ESCROW_ADDRESS=${EMERGENCY_ESCROW_ADDRESS}

  proxy-node-2:
    build:
      context: ./proxy-service
    ports:
      - "5002:5000"
    environment:
      - NODE_ID=2
      - PORT=5000
      - RPC_URL=${RPC_URL}
      - EMERGENCY_ESCROW_ADDRESS=${EMERGENCY_ESCROW_ADDRESS}

  proxy-node-3:
